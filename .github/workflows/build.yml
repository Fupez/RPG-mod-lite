name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Check
        run: ./gradlew check
      - name: Build
        run: ./gradlew build
