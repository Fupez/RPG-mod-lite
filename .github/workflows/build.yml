name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Check
        run: ./gradlew check
      - name: Native server gameplay tests
        run: ./gradlew runGameTest -PrpgGameTests=true
      - name: Build
        run: ./gradlew build
      - name: Save installable mod
        uses: actions/upload-artifact@v4
        with:
          name: rpg-playable
          path: |
            build/libs/rpg-playable-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
